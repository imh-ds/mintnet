name: Stage 9d Step 2 -- full-repeat mechanism cost re-measurement

# Corrected per D-088's own disclosure: the first attempt at this
# measurement ran as a single unsharded job and was cancelled by
# GitHub's 6-hour job limit before finishing. The mechanism this
# measures (growing_subset_dpi_structured_density_with_stability_
# rescue's own full re-screen-per-resample design) is embarrassingly
# parallel across bootstrap resamples -- each resample independently
# redraws the data and redoes the full pipeline from scratch. Sharded
# here by resample index (bootstraps=2 -> 2 shards), matching this
# project's own sharded_benchmark.yml precedent of one matrix job per
# independent unit of work, just on a new sharding axis (resample
# index within a single (dgp, N) cell) rather than the (dgp, N) grid
# that workflow already supports.

on:
  workflow_dispatch: {}

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        resample_index: [0, 1]
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python scripts/stage9d_full_repeat_cost_shard.py --resample-index ${{ matrix.resample_index }} --output shard-${{ matrix.resample_index }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage9d-full-repeat-shard-${{ matrix.resample_index }}
          path: shard-${{ matrix.resample_index }}.json
          retention-days: 90

  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: "stage9d-full-repeat-shard-*"
          path: shards
          merge-multiple: true
      - run: python scripts/aggregate_stage9d_full_repeat_shards.py --shards-glob "shards/*.json" --output result.json
      - run: cat result.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage9d-full-repeat-cost
          path: result.json
          retention-days: 90
